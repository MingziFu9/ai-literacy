# 第 7 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 7 生成 Word。
chapter: 7
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 了解深度伪造的演进、主要形态和鉴别思路
  - 理解提示词注入、对抗样本、数据投毒等威胁的基本原理
  - 了解对齐、护栏、红队测试等防御方法，以及联邦学习、差分隐私等隐私计算技术
  skill:
  - 能用“换渠道核实”等方法防范 AI 诈骗，能初步识别 AI 伪造内容
  - 能设计防御性的系统提示词并测试它是否守得住
  - 能说出使用开源模型和 AI 服务时的主要安全注意事项
  quality:
  - 树立“可信 AI”的意识，拒绝利用 AI 欺诈或传播虚假信息
  - 在信息爆炸的时代保持批判性思维，不轻信单一信源
  - 增强对 AI 相关法律法规的合规意识
key_points:
- 深度伪造的形态和防诈骗核实方法
- 提示词注入和对抗样本的原理
- 个人信息保护和隐私计算的基本思路
- 对齐、护栏、红队测试组成的纵深防御
difficulties:
- point: 理解对抗样本为什么“精心计算”的噪声比随机噪声有效
  solution: 用动画“对抗样本”对比两种噪声在同一强度下的效果
- point: 理解差分隐私为什么加噪声就能保护个人
  solution: 用动画“差分隐私”先做差分攻击，再加噪声重试，比较 ε = 0.1、1、10
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 55
    content: 7.1～7.3 节；操作动画“对抗样本”“AI 防火墙攻防”
    teacher: 在学习平台发布预习任务和思考题：如果接到“亲友”视频借钱，你会怎么核实？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: “10 分钟 430 万”AI 换脸诈骗案
    teacher: 讲述案例，提问“哪一步可以拦住”
    student: 回答
    intent: 建立防范意识
  - name: 红队攻防赛
    minutes: 20
    content: 各组设计一个“有秘密”的客服智能体，再互相攻击，记录成功的手法和有效的防守
    teacher: 组织比赛，讲解直接注入、间接注入和规则防御的局限
    student: 攻击、防守、记录
    intent: 理解提示词注入和纵深防御
  - name: 防诈情景演练
    minutes: 10
    content: 两人一组模拟“亲友视频借钱”，练习换渠道核实
    teacher: 组织演练、点评
    student: 演练
    intent: 掌握核实方法
  - name: 课堂练习与小结
    minutes: 10
    content: 课堂练习；纵深防御小结
    teacher: 组织作答
    student: 作答
    intent: 即时检验
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 35
    content: 7.4～7.5 节：防御体系、实战演练；操作动画“差分隐私”
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 25
    content: 体验 7-1 当一回红队；体验 7-2 隐私保护两步走
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 20
    content: 完成第 7 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 7 章课后练习：单选、判断题在线作答
- 简答题：提示词注入为什么难以彻底防住？请从大模型处理文字的方式说明原因，并列出两种缓解办法。
- 简答题：联邦学习和差分隐私分别怎样保护隐私？为什么二者常常一起使用？
- 简答题：一个可信的 AI 系统为什么要“层层设防”？请按训练时、研究上、运行时、发布前，各举一种防御手段。
- 体验报告：体验 7-1 当一回红队、体验 7-2 隐私保护两步走
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
