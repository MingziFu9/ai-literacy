# 第 4 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 4 生成 Word。
chapter: 4
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 理解从卷积神经网络（CNN）到视觉变换器（ViT）的架构变迁
  - 掌握扩散模型“加噪—去噪”的核心原理
  - 了解波形图、语谱图等音频基础特征，以及语音识别、语音合成的基本流程
  skill:
  - 能用国产 AI 绘画工具（如即梦、通义万相、可灵）生成符合要求的图像
  - 能用 AI 工具串起“脚本—画面—视频—配乐”，制作一段简单的短视频
  - 掌握图像提示词的 S-M-S-L-C 五要素公式
  quality:
  - 提升审美能力，学会与 AI 协同创作
  - 警惕深度伪造（Deepfake）引发的信任危机，掌握基本的鉴别方法
  - 尊重原创和他人的肖像、声音，依法标识 AI 生成内容
key_points:
- 计算机视觉三大任务和 CNN 的逐层特征提取
- 扩散模型的前向加噪与反向去噪
- 文生图五要素公式
- 深度伪造的识别与 AI 生成内容的法律要求
difficulties:
- point: 理解扩散模型怎样“从噪声中生成图像”
  solution: 用动画“扩散模型”拖动前向滑块、再从雪花去噪，换一片雪花对比；用“雕刻”类比
- point: 认识到“看不出破绽 ≠ 真的”
  solution: 用动画“找破绽”中的两张难题（完美 AI 人像、模糊截图）组织讨论，强调换渠道核实
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 55
    content: 4.1～4.3 节；操作动画“卷积滤镜”“扩散模型”“声音的波形与频谱”；完成体验 4-1 并带作品到课堂
    teacher: 在学习平台发布预习任务和思考题：AI 画的图和照片，你能分得出来吗？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 作品展评
    minutes: 15
    content: 各组展示体验 4-1 的作品和提示词，说明每个要素的作用
    teacher: 点评提示词，追问“去掉某要素会怎样”
    student: 展示、互评
    intent: 巩固五要素公式
  - name: 真假辨识赛
    minutes: 15
    content: 教师混放真实照片和 AI 图片，各组抢答并说出依据
    teacher: 组织比赛，揭晓答案并讲解破绽
    student: 抢答、说理由
    intent: 掌握常见破绽
  - name: 讨论与讲授
    minutes: 10
    content: 看不出破绽时靠什么判断？AI 生成内容标识办法、肖像权与声音权、AI 文生图版权案
    teacher: 引导讨论并讲解法律要点
    student: 讨论
    intent: 树立法律底线
  - name: 小结
    minutes: 5
    content: 课堂练习；知识导图回顾
    teacher: 组织作答
    student: 作答
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 35
    content: 4.4～4.7 节：AIGC 工具、视觉提示词、实战演练、视觉伦理；完成随堂小测
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 25
    content: 体验 4-2 让机器听和说；体验 4-3 真假鉴别
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 20
    content: 完成第 4 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 4 章课后练习：单选、判断题在线作答
- 简答题：用“雕刻”的比喻，说明扩散模型的前向加噪和反向去噪各起什么作用。
- 简答题：用 S-M-S-L-C 公式，为学校运动会写一个宣传海报的图像提示词，并标出每个要素。
- 简答题：如果你的朋友收到一段“妈妈”发来的语音，说手机丢了、急需转账，你会建议他怎么做？请结合本章知识说明理由。
- 体验报告：体验 4-1 五要素文生图、体验 4-2 让机器听和说、体验 4-3 真假鉴别
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
