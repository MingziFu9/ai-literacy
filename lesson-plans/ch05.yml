# 第 5 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 5 生成 Word。
chapter: 5
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 了解智能体的技术演进（规则式 → 学习式 → 大模型驱动）
  - 掌握智能体的“四大支柱”（大脑、规划、记忆、工具）和 ReAct 工作循环
  - 了解多智能体的协作模式和具身智能的分层控制思路
  skill:
  - 能用扣子（Coze）等零代码平台搭建一个带知识库和工具的智能体
  - 能运用结构化提示词和抗幻觉设计约束智能体的行为
  - 能用简单的测试检查智能体的效果和安全性
  quality:
  - 建立“人机协同”的工作观，理解“人在回路”的监督价值
  - 认识智能体自主行动可能带来的失控风险，明确人的责任边界
key_points:
- 智能体与大模型的区别
- 智能体的四大支柱：大脑、记忆、规划、工具
- 用零代码平台搭建智能体
- 多智能体协作的三种模式
difficulties:
- point: 理解智能体“思考—行动—观察”的循环
  solution: 用动画“看智能体怎样办事”回放全过程，让学生说出每一步为什么调用这个工具
- point: 在零代码平台上把人设、插件、记忆、工作流组合起来
  solution: 课前完成体验 5-1 的前两步，课堂路演时互相点评，教师集中讲解共性问题
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 70
    content: 5.1～5.2 节；操作动画“看智能体怎样办事”；完成体验 5-1 零代码搭一个学习助手
    teacher: 在学习平台发布预习任务和思考题：你希望一个智能体替你办哪件事？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 智能体路演
    minutes: 20
    content: 各组 3 分钟展示学习助手：解决什么问题、人设怎么写、用了哪些插件
    teacher: 点评设计，集中讲解共性问题
    student: 展示、互评
    intent: 巩固零代码搭建
  - name: 安全互测
    minutes: 15
    content: 交换智能体，尝试让它泄露人设或乱说话，记录成功的手法
    teacher: 组织活动，讲解提示词注入和最小权限
    student: 互测、记录
    intent: 建立安全意识
  - name: 讲授与小结
    minutes: 10
    content: 三种协作模式（动画“多智能体流水线”）；具身智能；评选“最有用”和“最安全”的智能体
    teacher: 讲解、组织评选
    student: 投票
    intent: 了解多智能体和具身智能
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 45
    content: 5.3～5.4 节：多智能体系统、具身智能；操作动画“多智能体流水线”“机器人的三层控制”
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 35
    content: 体验 5-2 看智能体怎样办事；体验 5-3 智能体安全体检
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 30
    content: 完成第 5 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 5 章课后练习：单选、判断题在线作答
- 简答题：什么是 ReAct 模式？请结合“查询明天天气并推荐穿搭”的例子，说明它的工作过程。
- 简答题：在扣子中搭建智能体时，为什么要设置“数据库”？它和“知识库”有什么不同？
- 简答题：什么是莫拉维克悖论？它对具身智能的发展有什么启示？
- 体验报告：体验 5-1 零代码搭一个学习助手、体验 5-2 看智能体怎样办事、体验 5-3 智能体安全体检
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
reflection: ''
