# 第 8 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 8 生成 Word。
chapter: 8
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 理解 AI 生成物版权的主要争议，以及我国法院判断“人的独创性智力投入”的思路
  - 了解算法偏见的三个来源（代表性偏差、历史偏见、代理变量）和“大数据杀熟”的原理
  - 了解《生成式人工智能服务管理暂行办法》的核心要求和全球 AI 监管的不同路向
  skill:
  - 能分析一个 AI 应用可能对哪些人群不公平，并提出改进办法
  - 能识别并规避使用 AIGC 时的常见法律风险（如侵犯肖像权、声音权、著作权）
  - 能在设计 AI 产品时，主动考虑隐私、依赖和弱势群体的需要
  quality:
  - 树立“科技向善”的伦理观，拒绝利用技术作恶
  - 在人机共处的时代保持批判性思维，不盲从算法的决定
  - 增强尊重知识产权、保护个人隐私的法律意识，诚信使用 AI 完成学业
key_points:
- AI 生成物版权的判断思路
- 算法偏见的三个来源和大数据杀熟
- 不同公平标准之间的取舍
- 生成式 AI 办法的核心要求和全球监管路向
difficulties:
- point: 理解“删掉性别”为什么不能消除偏见
  solution: 用动画“招聘模型偏见审计”分 5 步查代理变量和混淆矩阵
- point: 理解不同公平标准为什么无法同时满足
  solution: 以 COMPAS 争议为例，让学生分别站在报道方和软件公司一方说理由
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 55
    content: 8.1～8.4 节；操作动画“信息茧房”“自动驾驶的道德两难”；辩论双方准备论据
    teacher: 在学习平台发布预习任务和思考题：AI 生成的作品应不应该受版权保护？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 伦理辩论赛
    minutes: 20
    content: 辩题：“AI 生成的作品不应受版权保护”，正反方各陈述三条论据，自由辩论
    teacher: 主持辩论，结合北京互联网法院案点评
    student: 辩论
    intent: 理解独创性智力投入
  - name: 适老 AI 方案展示
    minutes: 15
    content: 各组展示为独居老人设计的适老 AI，说明怎样兼顾便利、隐私和尊严
    teacher: 点评方案中的隐私和尊重问题
    student: 展示、互评
    intent: 把伦理原则用到设计中
  - name: 课堂练习与全书小结
    minutes: 10
    content: 课堂练习；全书回顾：会提问、会核实、会协作、守底线
    teacher: 组织作答，总结全书
    student: 作答
    intent: 形成全书知识结构
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 35
    content: 8.5～8.6 节：行业伦理困境、偏见审计与适老设计；操作动画“招聘模型偏见审计”
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 25
    content: 体验 8-1 给 AI 做一次偏见体检；体验 8-2 我的 AI 学习使用公约
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 20
    content: 完成第 8 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 8 章课后练习：单选、判断题在线作答
- 简答题：为什么说“删掉敏感特征”不能保证算法公平？请结合代理变量和历史偏见说明，并提出两种改进办法。
- 简答题：以 COMPAS 争议为例，说明为什么“选择哪种公平”是一个社会选择，而不仅是技术问题。
- 简答题：结合本章内容，谈谈大学生应怎样使用 AI 完成学业，才能既提高效率又不陷入“认知外包”和学术不端。
- 体验报告：体验 8-1 给 AI 做一次偏见体检、体验 8-2 我的 AI 学习使用公约
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
