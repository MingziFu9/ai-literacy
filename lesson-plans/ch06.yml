# 第 6 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 6 生成 Word。
chapter: 6
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 理解“AI+X”从“工具赋能”到“流程重构”再到“生态颠覆”的三层融合逻辑
  - 熟悉 AI 在科学、制造、医疗、艺术等领域的典型应用场景
  - 了解生成式 AI 对内容生产流程的改变
  skill:
  - 能识别本专业中的“痛点”和可用的数据，提出初步的 AI 解决思路
  - 能用国产 AI 工具做一个跨界应用的小原型
  quality:
  - 培养跨界思维，打破学科壁垒
  - 树立正确的 AI 伦理观，关注数据隐私、算法偏见和人的最终责任
  - 养成核查数据来源的习惯
key_points:
- AI+X 的含义
- 三层融合模型：工具赋能、流程重构、生态颠覆
- 用三问法找本专业的 AI 应用痛点
difficulties:
- point: 判断一个案例改到了哪一层
  solution: 用动画“AI+X 三层分类器”分组分类，挑黄色卡片辩论：流程变了没有？有没有新业态？
- point: 区分企业宣传数据和经过核实的数据
  solution: 体验 6-2 数据核查员：追查一条“效率提升 ×× 倍”的数据来源
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 55
    content: 6.1～6.4 节（选读与本专业相关的行业）；操作动画“AI+X 三层分类器”；完成体验 6-1 方案初稿
    teacher: 在学习平台发布预习任务和思考题：你的专业里，哪里最“烦”、最“难”、最“险”？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 方案路演
    minutes: 25
    content: 各组 5 分钟：痛点、AI 能力、改到哪一层、数据和合规
    teacher: 组织路演，从可行性、价值、风险三方面点评
    student: 展示、提问
    intent: 运用三层模型和三问法
  - name: 讨论
    minutes: 10
    content: 有没有“为了 AI 而 AI”？哪些环节必须由人负责？
    teacher: 引导讨论
    student: 讨论
    intent: 形成理性的 AI+X 观
  - name: 课堂练习与小结
    minutes: 10
    content: 课堂练习；小结三层模型
    teacher: 组织作答
    student: 作答
    intent: 即时检验
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 35
    content: 6.5 节：成为 AI+X 架构师；完成随堂小测
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 课后巩固
    minutes: 45
    content: 完成第 6 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 6 章课后练习：单选、判断题在线作答
- 简答题：请用一个例子说明“物理拼接”与“化学反应”在 AI 产业融合中的区别。
- 简答题：举例说明 AI 在医疗影像诊断中的作用及局限。
- 简答题：结合你的专业，用“三问法”找出一个可以用 AI 改进的工作环节，并说明可能的风险。
- 体验报告：体验 6-1 AI+我的专业：做一个小原型、体验 6-2 数据核查员
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
reflection: ''
