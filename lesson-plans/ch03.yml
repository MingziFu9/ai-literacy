# 第 3 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 3 生成 Word。
chapter: 3
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 理解自然语言处理从规则到统计再到神经网络的演变
  - 能用一个例句说明注意力机制怎样帮助模型理解上下文
  - 熟悉预训练、监督微调、人类反馈强化学习的全流程
  skill:
  - 熟练运用 CO-STAR 框架编写提示词
  - 掌握思维链（CoT）与少样本（Few-shot）提示技巧
  - 能用国产大模型完成文献阅读、写作辅助等任务，并能搭建简单的知识库问答
  quality:
  - 建立人机协作意识
  - 培养对 AI 幻觉的批判性思维
  - 遵守 AI 使用的伦理规范和学术规范
key_points:
- 大模型养成的三个阶段：预训练、监督微调、人类反馈强化学习
- CO-STAR 提示词法则
- RAG 的原理和用途
- 幻觉等四类风险及应对
difficulties:
- point: 把一句模糊的需求改写成结构完整的提示词
  solution: 先用动画“提示词改写前后”逐个勾选六要素，再在线下“改写擂台”中实战
- point: 理解 RAG 为什么能减少幻觉，又为什么会因资料缺失而答错
  solution: 用动画“RAG 开卷考试”先比较闭卷和开卷，再勾掉一段资料重问
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 70
    content: 3.1～3.4 节；操作动画“词向量”“温度与采样”
    teacher: 在学习平台发布预习任务和思考题：同一个问题问两遍，为什么答案不一样？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: 对比“帮我写个通知”和一句完整的提示词得到的输出
    teacher: 现场演示两条提示词
    student: 比较输出差别
    intent: 引出提示词工程
  - name: 讲授与演示
    minutes: 10
    content: CO-STAR 六要素；少样本提示和思维链（动画“提示词改写前后”）
    teacher: 讲解并演示
    student: 记录六要素
    intent: 掌握提示词框架
  - name: 活动：提示词改写擂台
    minutes: 20
    content: 教师给出小白提示词和任务，各组用 CO-STAR 改写并现场生成，全班投票；再请一组故意缺一个要素
    teacher: 组织比赛、点评
    student: 分组改写、投票、说理由
    intent: 在实践中掌握提示词
  - name: 课堂练习与小结
    minutes: 10
    content: RAG 原理回顾（动画“RAG 开卷考试”）；课堂练习；小结四类风险
    teacher: 组织作答，布置体验 3-2
    student: 作答、复述要点
    intent: 即时检验
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 45
    content: 3.5～3.8 节：提示词工程、RAG 与智能体、实战演练、风险与挑战；完成随堂小测
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 35
    content: 体验 3-1 提示词改写前后对比；体验 3-2 文档知识库问答；体验 3-3 两个模型盲评
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 30
    content: 完成第 3 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 3 章课后练习：单选、判断题在线作答
- 简答题：用“大厨养成”的比喻，说明大模型训练的三个阶段各自解决什么问题。
- 简答题：用 CO-STAR 框架，为“向学院申请举办一次 AI 主题讲座”写一个提示词。
- 简答题：RAG 为什么能减少幻觉？它有哪些局限？
- 体验报告：体验 3-1 提示词改写前后对比、体验 3-2 文档知识库问答、体验 3-3 两个模型盲评
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
