# 第 2 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 2 生成 Word。
chapter: 2
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 理解神经网络的工作原理，掌握“误差反向传递”的核心思想
  - 理解 Transformer 架构的创新（注意力机制），以及推理模型如何通过“先思考再回答”获得更强的推理能力
  - 了解中国深度学习生态，包括百度飞桨与 DeepSeek 等
  skill:
  - 能够跳出技术黑盒，用“层层传递、层层追责”的思路解释 AI 是怎样学习的
  - 能够分辨大模型在实际应用中的边界与局限
  - 能够梳理深度学习 70 年发展史的核心脉络
  quality:
  - 树立“数据与算力协同”的科学思维，培养对 AI 能力边界的清醒认知
  - 建立对中国 AI 自主创新的自信心
  - 增强技术伦理意识，树立科技向善、以人为本的科技观
key_points:
- 神经网络怎样学习：损失、反向传播、梯度下降
- 过拟合的表现和对策
- 快思考与慢思考、推理模型的特点
- Transformer 和注意力机制的作用
difficulties:
- point: 理解反向传播“从后往前追责、每个权重挪一小步”
  solution: 线下课角色扮演：每组 5 人扮演网络各层，三轮“追责”后看预测是否变准；配合动画“梯度下降”
- point: 理解注意力机制怎样让每个词看到所有词
  solution: 用动画“自注意力”点击“它”，看它把注意力放在“小猫”上；用“鸡尾酒会”类比
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 70
    content: 2.1～2.2 节；操作动画“神经元与激活函数”“手写数字识别”“快思考与慢思考”
    teacher: 在学习平台发布预习任务和思考题：为什么推理模型回答得更慢？慢一点一定更好吗？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: 一张猫的照片，机器怎样认出来？写规则 vs 让它自己学
    teacher: 提问，引出“从数据中学习”
    student: 说出自己的想法
    intent: 建立直觉
  - name: 活动：反向传播角色扮演
    minutes: 15
    content: 5 人一组扮演网络各层，教师公布答案后从后往前“追责”，每人调整“权重”，重复三轮
    teacher: 组织活动，结束后对照动画“梯度下降”总结
    student: 参与角色扮演
    intent: 突破反向传播难点
  - name: 讲授与演示
    minutes: 15
    content: 推理模型的特点和 DeepSeek-R1 的三大突破；Transformer 和注意力（动画“自注意力”）
    teacher: 讲解并现场演示
    student: 跟着动画判断“它”指谁
    intent: 理解注意力的作用
  - name: 对比讨论与小结
    minutes: 10
    content: 展示两个推理模型对同一道题的思考过程，讨论什么时候该开“深度思考”；课堂练习；小结
    teacher: 组织讨论和作答
    student: 讨论、作答
    intent: 学会合理使用推理模型
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 45
    content: 2.3～2.5 节：Transformer、算法的应用版图、深度学习简史；完成随堂小测
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 35
    content: 体验 2-1 深度思考开关对比；体验 2-2 识图找错
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 30
    content: 完成第 2 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 2 章课后练习：单选、判断题在线作答
- 简答题：用“公司追责”的比喻，说明反向传播是怎样让神经网络从错误中学习的。
- 简答题：什么是过拟合？请列举两种防止过拟合的方法。
- 简答题：推理模型在哪些任务上表现突出？在哪些任务上仍然不可靠？
- 体验报告：体验 2-1 深度思考开关对比、体验 2-2 识图找错
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
