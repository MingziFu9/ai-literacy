# 第 1 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 1 生成 Word。
chapter: 1
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 讨论法
- 线上自主学习
- 任务驱动法（在线体验）
objectives:
  knowledge:
  - 理解 AI 的四种定义路径（像人一样思考 / 行动 vs 理性地思考 / 行动）
  - 掌握 AI 发展的三次浪潮与三大流派的核心思想
  - 熟悉 2023—2025 年 AI 爆发背后的三大支柱（算力 + 数据 + 算法）
  skill:
  - 能运用 AI 三支柱框架分析具体应用
  - 掌握基本的提示词技巧
  - 能使用至少 2 款国产主流 AI 工具完成实际任务
  quality:
  - 建立对 AI 的科学认知，既不神化也不妖魔化
  - 培养对 AI 幻觉、算法偏见的批判性思维
  - 形成人机协作意识
key_points:
- AI 的四种定义路径和图灵测试
- 三次浪潮、两次寒冬和三大流派
- 大模型的三大支柱和“预测下一个词”的本质
difficulties:
- point: 理解“像人”和“有智能”的区别（图灵测试与中文房间）
  solution: 先让学生玩动画“图灵测试小游戏”，再讲中文房间思想实验，组织正反两方各说理由
- point: 理解单层感知机为什么解决不了异或、多层网络为什么可以
  solution: 用动画“感知机与异或难题”先让学生自己拖直线失败，再打开“两条直线”模式
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 70
    content: 1.1～1.4 节（学前导读、正文、随堂小测）；操作动画“图灵测试小游戏”“人工智能发展时间线”“感知机与异或难题”
    teacher: 在学习平台发布预习任务和思考题：你今天用过哪些 AI？你觉得它“聪明”吗？
    student: 阅读教材、操作动画、完成随堂小测，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: 请学生说出今天用过的 AI，按推荐、识别、生成分类
    teacher: 提问并板书分类
    student: 举例、分类
    intent: 建立“AI 就在身边”的直觉
  - name: 活动：图灵测试现场版
    minutes: 20
    content: 一组真人、一组用大模型回答其他同学的提问，裁判记录判断理由
    teacher: 组织分组、控制时间，点评哪些问题最能区分人和 AI
    student: 提问、作答、投票判断
    intent: 体验图灵测试的做法和局限
  - name: 讲授与讨论
    minutes: 10
    content: 三大支柱：为什么大模型在 2022 年前后爆发？三大流派的代表
    teacher: 讲解，引导学生用三大支柱分析
    student: 小组讨论并汇报
    intent: 形成“算法 + 算力 + 数据”的分析框架
  - name: 课堂练习与小结
    minutes: 10
    content: 课件中的课堂练习；用知识导图回顾本章；强调“结果要核实、隐私要保护、责任在自己”
    teacher: 组织作答，讲评，布置课后任务
    student: 作答、复述要点
    intent: 即时检验，形成知识结构
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 45
    content: 1.5～1.7 节：生成式 AI 全景、提示词与智能体、风险与挑战；完成随堂小测
    teacher: 发布任务，在讨论区答疑
    student: 阅读教材、操作动画、完成随堂小测
    intent: 完成本章其余内容的学习
  - name: 在线体验
    minutes: 35
    content: 体验 1-1 和大模型玩一局图灵测试；体验 1-2 同一问题问两个国产模型
    teacher: 提供体验指导，线上答疑并批阅体验报告
    student: 按步骤完成体验，提交体验报告
    intent: 在真实工具中运用本章知识
  - name: 课后巩固
    minutes: 30
    content: 完成第 1 章课后练习（在线作答 12 题，简答 3 题）
    teacher: 批改作业，讲评共性错误
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识
homework:
- 第 1 章课后练习：单选、判断题在线作答
- 简答题：请简述 AI 四种定义路径的核心区别。
- 简答题：什么是 AI 三支柱？请以一款你常用的 AI 应用为例说明它们如何共同起作用。
- 简答题：什么是“涌现”？为什么说它还有争议？
- 体验报告：体验 1-1 和大模型玩一局图灵测试、体验 1-2 同一问题问两个国产模型
assessment: 线上学习进度与随堂小测（20%）、课堂活动与讨论（20%）、课后练习（30%）、体验报告与作品（30%），计入平时成绩
