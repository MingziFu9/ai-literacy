<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG 开卷考试</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
  .doc { display:flex; gap:6px; align-items:flex-start; font-size:12.5px; padding:4px 6px; border-radius:6px; margin:2px 0; border:1px solid transparent; }
  .doc.off { opacity:.35; text-decoration:line-through; }
  .doc.hit { border-color:var(--accent); background:var(--soft); }
  .doc .id { flex:none; font-weight:bold; color:var(--accent); width:1.8em; }
  .ans { white-space:pre-wrap; background:#fffde7; border-radius:6px; padding:8px; min-height:3em; font-size:13.5px; }
  .closed { background:#fff3e0; }
  .score { font-variant-numeric:tabular-nums; }
  .warn { color:var(--warn); }
</style>
</head>
<body>
<h1>RAG“开卷考试”：先查资料，再回答</h1>
<div class="sub">资料库是一份虚构的《××职业技术学院学生手册》节选。选一个问题，比较“闭卷”和“开卷”的回答；勾掉某段资料，看看会发生什么。</div>

<div class="row ex" id="qs"></div>
<div class="row"><span class="lbl">或者自己提问：</span><input type="text" id="own" placeholder="例如：转专业有什么条件？"><button id="ask">提问</button></div>

<div class="grid2">
  <div>
    <div class="box"><h2>① 闭卷：只凭模型“记忆”回答</h2><div class="ans closed" id="ca"></div></div>
    <div class="box"><h2>② 检索：问题和每段资料的相似度（前 3 名高亮）</h2><div id="rank"></div><div class="note">相似度用“两个字一组”的重合程度计算（余弦相似度），真实系统用嵌入模型把文字变成向量再比较。</div></div>
    <div class="box"><h2>③ 开卷：看着资料回答</h2><div class="ans" id="oa"></div></div>
  </div>
  <div class="box"><h2>资料库（点击勾选 / 取消）</h2><div id="docs"></div></div>
</div>

<script>
(function () {
  var DOCS = [
    "请假：学生因病请假 3 天以内（含 3 天）由辅导员批准；超过 3 天的，须经二级学院审批，并附医院证明。",
    "缓考：因病或其他特殊原因不能参加课程考试的，应在考试开始前向二级学院提交缓考申请，经教务处批准后，随下一次补考一起参加考试。",
    "补考：课程考核不及格的学生，可在下一学期开学第 2 周参加补考。补考须在开学第 1 周内登录教务系统报名，逾期不予安排。",
    "奖学金：学校设一等奖学金每人 2000 元、二等奖学金每人 1000 元，每学年评定一次，学年内有课程不及格的学生不能参评。",
    "图书馆：图书馆开放时间为每天 8:00 至 22:00；期末考试周延长至 23:00。借书须本人刷校园卡，每人最多借 10 本。",
    "宿舍：学生宿舍每晚 23:00 熄灯。禁止使用电热毯、电饭煲等大功率电器，违者没收并通报批评。",
    "转专业：学生在第一学年结束时可以申请转专业，申请时第一学年的平均学分绩点须排在本专业前 30%，且无违纪处分。",
    "毕业：学生须修满 140 学分，并取得至少 1 项与专业相关的职业技能等级证书，方可毕业。"
  ];
  var Q = [
    { q:"补考在什么时候报名？", key:2, closed:"补考一般在学期末统一安排，请在期末考试结束后一周内向辅导员提交书面申请。", open:"根据资料 [3]，补考须在下一学期开学第 1 周内登录教务系统报名，补考本身安排在开学第 2 周。逾期不予安排。" },
    { q:"考试周图书馆开到几点？", key:4, closed:"图书馆通常晚上 21:30 闭馆，考试周也是一样。", open:"根据资料 [5]，图书馆平时 8:00 至 22:00 开放，期末考试周延长到 23:00。" },
    { q:"请病假 5 天需要谁批准？", key:0, closed:"请病假由辅导员批准即可，一般不需要其他手续。", open:"根据资料 [1]，超过 3 天的病假须经二级学院审批，并附医院证明；5 天属于这种情况。" },
    { q:"学校食堂几点关门？", key:-1, closed:"学校食堂晚上 20:00 关门，周末 19:30 关门。", open:"" }
  ];
  var on = DOCS.map(function () { return true; }), cur = 0, ownQ = null;
  var STOP = "的了是在和与及或吗呢吧啊什么怎么几点哪里需要可以一个有没请问学生学校";
  function $(id) { return document.getElementById(id); }
  function grams(s) {
    var t = s.replace(/[，。；：、？！（）“”\s\d:]/g, "").split("").filter(function (c) { return STOP.indexOf(c) < 0; }).join(""), g = {};
    for (var i = 0; i < t.length - 1; i++) { var k = t.substr(i, 2); g[k] = (g[k] || 0) + 1; }
    for (var j = 0; j < t.length; j++) { g[t[j]] = (g[t[j]] || 0) + 0.3; }
    return g;
  }
  function cos(a, b) { var d = 0, na = 0, nb = 0, k; for (k in a) { na += a[k] * a[k]; if (b[k]) d += a[k] * b[k]; } for (k in b) nb += b[k] * b[k]; return na && nb ? d / Math.sqrt(na * nb) : 0; }
  var DG = DOCS.map(grams), TH = 0.06;
  function run() {
    var q = ownQ !== null ? { q:ownQ, key:null, closed:"（闭卷回答：模型会根据“一般学校”的印象编一个听起来合理的答案，可能和本校规定不一样。）" } : Q[cur];
    var qg = grams(q.q);
    var sc = DOCS.map(function (_, i) { return { i:i, s:on[i] ? cos(qg, DG[i]) : -1 }; }).sort(function (a, b) { return b.s - a.s; });
    var top = sc.filter(function (x) { return x.s >= 0; }).slice(0, 3);
    $("ca").innerHTML = q.closed + (q.key !== null ? ' <span class="bad">（与学生手册不符，是编出来的）</span>' : "");
    $("rank").innerHTML = sc.filter(function (x) { return x.s >= 0; }).map(function (x, r) {
      return '<div class="barrow"><span>资料 [' + (x.i + 1) + "]</span><div><div class=\"bar\" style=\"width:" + Math.min(100, x.s * 160).toFixed(0) + "%;" + (r < 3 ? "" : "background:#cfd8dc") + '"></div></div><span class="v score">' + x.s.toFixed(2) + "</span></div>";
    }).join("") || '<div class="warn">资料库是空的。</div>';
    document.querySelectorAll(".doc").forEach(function (d, i) { d.classList.toggle("hit", top.some(function (x) { return x.i === i && x.s >= TH; })); });
    var best = top[0], a;
    if (!best || best.s < TH) a = "资料库里没有找到和这个问题相关的内容（最高相似度 " + (best ? best.s.toFixed(2) : "0") + "，低于阈值 " + TH + "），所以我无法根据学生手册回答。建议咨询学校相关部门。" + (q.key === -1 ? '\n<span class="ok">✓ 老实说“没找到”，比闭卷时编一个时间强得多。</span>' : "");
    else if (q.key === null) a = "检索到最相关的是资料 [" + (best.i + 1) + "]：" + DOCS[best.i] + "\n（模型会根据这段资料组织回答，并注明出处。请核对它是否真的回答了你的问题。）";
    else if (best.i === q.key) a = q.open + '\n<span class="ok">✓ 回答有出处，可以翻到资料 [' + (q.key + 1) + "] 核对。</span>";
    else a = "根据资料 [" + (best.i + 1) + "]，" + DOCS[best.i].split("：")[1].split("。")[0] + "。\n" + '<span class="warn">⚠ 检索到的资料“沾边”但不对题，回答也就答非所问。' + (on[q.key] === false ? "关键资料 [" + (q.key + 1) + "] 已被你从库里删掉了。" : "") + "这就是 RAG 的局限：没检索到关键内容，仍然可能答错。</span>";
    $("oa").innerHTML = a;
  }
  function renderDocs() {
    $("docs").innerHTML = DOCS.map(function (d, i) { return '<div class="doc' + (on[i] ? "" : " off") + '" data-i="' + i + '"><span class="id">[' + (i + 1) + "]</span><span>" + d + "</span></div>"; }).join("");
    document.querySelectorAll(".doc").forEach(function (d) { d.onclick = function () { var i = +d.dataset.i; on[i] = !on[i]; renderDocs(); run(); }; });
  }
  $("qs").innerHTML = '<span class="lbl">问题：</span>' + Q.map(function (q, i) { return '<button data-i="' + i + '">' + q.q + "</button>"; }).join("");
  document.querySelectorAll("#qs button").forEach(function (b) { b.onclick = function () { cur = +b.dataset.i; ownQ = null; document.querySelectorAll("#qs button").forEach(function (x) { x.classList.toggle("on", x === b); }); run(); }; });
  $("ask").onclick = function () { var v = $("own").value.trim(); if (!v) return; ownQ = v; document.querySelectorAll("#qs button").forEach(function (x) { x.classList.remove("on"); }); run(); };
  $("own").onkeydown = function (e) { if (e.key === "Enter") $("ask").onclick(); };
  document.querySelector("#qs button").classList.add("on");
  renderDocs(); run();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
