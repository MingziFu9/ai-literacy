<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K 近邻与 K 均值</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
  canvas { width:100%; height:340px; display:block; border:1px solid var(--line); border-radius:6px; touch-action:none; cursor:crosshair; }
  .legend { font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 3px 0 8px; vertical-align:-1px; }
  .tabs button { font-size:13.5px; }
  .kv { min-width:2em; font-weight:bold; color:var(--accent); }
</style>
</head>
<body>
<h1>K 近邻与 K 均值：同样是“看距离”，一个分类，一个分群</h1>
<div class="sub">横轴：每月到店次数；纵轴：平均每次消费（元）。数据为编者构造的 24 位奶茶店会员，与教材 3.5、3.6 节的例子同一场景。</div>

<div class="row tabs">
  <button id="m-knn" class="on">K 近邻分类</button>
  <button id="m-km">K 均值聚类</button>
</div>

<canvas id="cv" aria-label="会员散点图"></canvas>
<div class="legend" id="legend"></div>

<div class="row">
  <span>K =</span>
  <input type="range" id="k" min="1" max="9" step="1" value="3" aria-label="K 值">
  <span class="kv" id="kv">3</span>
</div>
<div class="row ex" id="ctrl-knn"><span class="lbl">试一试：</span><button data-k="1">K = 1</button><button data-k="3">K = 3</button><button data-k="7">K = 7</button><span class="lbl">　点击图上任意位置，放一位新会员</span></div>
<div class="row" id="ctrl-km" hidden>
  <button class="main" id="step">下一步</button>
  <button id="reset">换一组起点</button>
  <span class="lbl" id="iter"></span>
</div>

<div class="box"><div class="msg" id="msg"></div></div>
<div class="note">说明：为了让两个特征“一样重要”，计算距离前把消费金额除以 4（相当于 4 元消费和 1 次到店算作同样远），这一步叫特征缩放，《机器学习》第 2 章会详细讲。</div>

<script>
(function () {
  // 24 位会员：[到店次数, 平均消费, 类别]，类别 1 = 常客，0 = 普通会员（编者构造）
  var DATA = [[1,22,0],[2,30,0],[2,18,0],[3,25,0],[3,34,0],[4,20,0],[4,28,0],[5,16,0],[5,31,0],[6,18,0],[2,40,0],[6,24,0],
              [7,30,1],[8,28,1],[8,36,1],[9,22,1],[9,33,1],[10,26,1],[10,38,1],[11,30,1],[12,24,1],[12,35,1],[7,40,1],[11,42,1]];
  var X0 = 0, X1 = 13, Y0 = 10, Y1 = 46, SCALE = 4;
  var COLORS = ["#3f51b5", "#ef6c00", "#43a047", "#8e24aa"];
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var kIn = document.getElementById("k"), msg = document.getElementById("msg");
  var mode = "knn", probe = [7, 26], centers = [], assign = [], iter = 0, seed = 1, stage = 0;

  function dist(a, b) { var dx = a[0] - b[0], dy = (a[1] - b[1]) / SCALE; return Math.sqrt(dx * dx + dy * dy); }
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var pad = { l: 34, r: 10, t: 10, b: 26 };
  function sx(x) { return pad.l + (x - X0) / (X1 - X0) * (cv.clientWidth - pad.l - pad.r); }
  function sy(y) { return pad.t + (Y1 - y) / (Y1 - Y0) * (cv.clientHeight - pad.t - pad.b); }

  function axes() {
    var dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#eceff1"; ctx.fillStyle = "#78909c"; ctx.font = "11px sans-serif";
    for (var x = 0; x <= 12; x += 2) { ctx.beginPath(); ctx.moveTo(sx(x), sy(Y0)); ctx.lineTo(sx(x), sy(Y1)); ctx.stroke(); ctx.textAlign = "center"; ctx.fillText(x, sx(x), H - 8); }
    for (var y = 10; y <= 45; y += 5) { ctx.beginPath(); ctx.moveTo(sx(X0), sy(y)); ctx.lineTo(sx(X1), sy(y)); ctx.stroke(); ctx.textAlign = "right"; ctx.fillText(y, pad.l - 4, sy(y) + 4); }
  }
  function dot(p, color, r, ring) {
    ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), r, 0, 7);
    ctx.fillStyle = color; ctx.fill();
    if (ring) { ctx.lineWidth = 2; ctx.strokeStyle = "#263238"; ctx.stroke(); }
  }

  function drawKnn() {
    var k = +kIn.value;
    axes();
    var order = DATA.map(function (d, i) { return [dist(d, probe), i]; }).sort(function (a, b) { return a[0] - b[0]; });
    var near = order.slice(0, k), votes = [0, 0];
    ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    near.forEach(function (o) { var d = DATA[o[1]]; votes[d[2]]++; ctx.beginPath(); ctx.moveTo(sx(probe[0]), sy(probe[1])); ctx.lineTo(sx(d[0]), sy(d[1])); ctx.stroke(); });
    ctx.setLineDash([]);
    DATA.forEach(function (d) { dot(d, d[2] ? COLORS[1] : COLORS[0], 5); });
    near.forEach(function (o) { var d = DATA[o[1]]; dot(d, d[2] ? COLORS[1] : COLORS[0], 6, true); });
    var label = votes[1] > votes[0] ? 1 : 0;
    ctx.beginPath(); var px = sx(probe[0]), py = sy(probe[1]);
    ctx.moveTo(px, py - 9); ctx.lineTo(px + 8, py + 6); ctx.lineTo(px - 8, py + 6); ctx.closePath();
    ctx.fillStyle = label ? COLORS[1] : COLORS[0]; ctx.fill(); ctx.strokeStyle = "#263238"; ctx.lineWidth = 2; ctx.stroke();
    document.getElementById("legend").innerHTML = '<i style="background:' + COLORS[0] + '"></i>普通会员<i style="background:' + COLORS[1] + '"></i>常客　三角形：新会员（颜色是预测结果）　黑圈：离它最近的 K 位会员';
    msg.innerHTML = "新会员：每月到店 <b>" + probe[0].toFixed(1) + "</b> 次、平均消费 <b>" + probe[1].toFixed(0) + "</b> 元。最近的 " + k + " 位邻居里，常客 <b>" + votes[1] + "</b> 位、普通会员 <b>" + votes[0] + "</b> 位，所以判为<b class='" + (label ? "bad" : "") + "'>" + (label ? "常客" : "普通会员") + "</b>。" +
      (votes[0] === votes[1] ? "（票数相同，本动画规定判为普通会员；实际使用时一般把 K 取成奇数避免平票。）" : "");
  }

  function initKm() {
    var k = +kIn.value; centers = []; assign = DATA.map(function () { return -1; }); iter = 0; stage = 0;
    var used = {};
    while (centers.length < k) { var i = Math.floor(rnd() * DATA.length); if (!used[i]) { used[i] = 1; centers.push([DATA[i][0], DATA[i][1]]); } }
  }
  function stepKm() {
    if (stage === 0) {
      assign = DATA.map(function (d) { var best = 0; centers.forEach(function (c, j) { if (dist(d, c) < dist(d, centers[best])) best = j; }); return best; });
      stage = 1; iter++;
      return "第 " + iter + " 轮 · 分组：每位会员归到离自己最近的中心。";
    }
    var moved = 0;
    centers = centers.map(function (c, j) {
      var pts = DATA.filter(function (d, i) { return assign[i] === j; });
      if (!pts.length) return c;
      var nc = [pts.reduce(function (s, d) { return s + d[0]; }, 0) / pts.length, pts.reduce(function (s, d) { return s + d[1]; }, 0) / pts.length];
      moved = Math.max(moved, dist(nc, c)); return nc;
    });
    stage = 0;
    return moved < 1e-9 ? "中心不再移动，聚类完成，一共 " + iter + " 轮。" : "第 " + iter + " 轮 · 更新：每个中心移到本组会员的平均位置。";
  }
  function drawKm(text) {
    axes();
    DATA.forEach(function (d, i) { dot(d, assign[i] < 0 ? "#b0bec5" : COLORS[assign[i]], 5); });
    centers.forEach(function (c, j) {
      var x = sx(c[0]), y = sy(c[1]); ctx.lineWidth = 3; ctx.strokeStyle = COLORS[j];
      ctx.beginPath(); ctx.moveTo(x - 8, y - 8); ctx.lineTo(x + 8, y + 8); ctx.moveTo(x + 8, y - 8); ctx.lineTo(x - 8, y + 8); ctx.stroke();
    });
    document.getElementById("legend").textContent = "灰点：还没分组的会员　× ：各组的中心　颜色：所属的组（K 均值看不到“常客 / 普通”的标签）";
    document.getElementById("iter").textContent = "已进行 " + iter + " 轮";
    var sizes = centers.map(function (c, j) { return assign.filter(function (a) { return a === j; }).length; });
    msg.innerHTML = (text || "随机选了 " + centers.length + " 个起点作为中心，点“下一步”开始。") +
      (iter ? "<br>各组人数：" + sizes.map(function (s, j) { return '<b style="color:' + COLORS[j] + '">' + s + "</b>"; }).join(" / ") +
        "；中心位置：" + centers.map(function (c) { return "(" + c[0].toFixed(1) + " 次, " + c[1].toFixed(0) + " 元)"; }).join("、") : "");
  }

  function render() { document.getElementById("kv").textContent = kIn.value; if (mode === "knn") drawKnn(); else drawKm(); }
  function setMode(m) {
    mode = m;
    document.getElementById("m-knn").classList.toggle("on", m === "knn");
    document.getElementById("m-km").classList.toggle("on", m === "km");
    document.getElementById("ctrl-knn").hidden = m !== "knn";
    document.getElementById("ctrl-km").hidden = m !== "km";
    kIn.max = m === "knn" ? 9 : 4; kIn.min = m === "knn" ? 1 : 2;
    if (m === "km") { kIn.value = Math.min(4, Math.max(2, +kIn.value)); initKm(); }
    render();
  }
  document.getElementById("m-knn").onclick = function () { setMode("knn"); };
  document.getElementById("m-km").onclick = function () { setMode("km"); };
  kIn.oninput = function () { if (mode === "km") initKm(); render(); };
  document.querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { kIn.value = b.dataset.k; render(); }; });
  document.getElementById("step").onclick = function () { drawKm(stepKm()); };
  document.getElementById("reset").onclick = function () { seed += 7; initKm(); drawKm(); };
  cv.addEventListener("pointerdown", function (e) {
    if (mode !== "knn") return;
    var r = cv.getBoundingClientRect(), W = cv.clientWidth, H = cv.clientHeight;
    var x = X0 + (e.clientX - r.left - pad.l) / (W - pad.l - pad.r) * (X1 - X0);
    var y = Y1 - (e.clientY - r.top - pad.t) / (H - pad.t - pad.b) * (Y1 - Y0);
    probe = [Math.max(X0, Math.min(X1, x)), Math.max(Y0, Math.min(Y1, y))]; render();
  });
  window.addEventListener("resize", render);
  render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
