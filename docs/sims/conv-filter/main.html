<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卷积滤镜：一个小窗口滑过整张图</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
  .imgs { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:620px) { .imgs { grid-template-columns:1fr; } }
  .imgs canvas { width:100%; max-width:320px; aspect-ratio:1; image-rendering:pixelated; border:1px solid var(--line); border-radius:4px; display:block; margin:0 auto; cursor:crosshair; touch-action:none; }
  .cap { text-align:center; font-size:12.5px; color:var(--muted); margin-top:3px; }
  .k { display:inline-grid; grid-template-columns:repeat(3,3.2em); gap:3px; vertical-align:middle; }
  .k input { width:3.2em; padding:3px 2px; text-align:center; border:1px solid var(--line); border-radius:4px; font:inherit; font-size:13px; }
  .calc { display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:13px; }
  .m3 { display:inline-grid; grid-template-columns:repeat(3,2.8em); gap:2px; }
  .m3 span { text-align:center; padding:2px 0; border-radius:3px; font-variant-numeric:tabular-nums; font-size:12px; }
  .formula { font-size:12.5px; line-height:1.7; flex:1; min-width:240px; }
  .rgb .sl { display:grid; grid-template-columns:2.5em 1fr 2.5em; gap:6px; align-items:center; font-size:13px; }
  #imgs button, #kers button { margin:2px 1px; }
  .sw { width:64px; height:64px; border-radius:6px; border:1px solid var(--line); }
</style>
</head>
<body>
<h1>卷积滤镜：一个 3 × 3 的小窗口滑过整张图</h1>
<div class="sub">左边是原图（灰度图，每个像素是 0～255 的数，0 最黑、255 最白），右边是用卷积核处理后的结果。点或拖动左图上的任意位置，下方会显示这一格是怎样算出来的；点“扫描”看窗口怎样一格格滑过整张图。</div>

<div class="row ex"><span class="lbl">图片：</span><span id="imgs"></span><button id="upBtn" type="button">用自己的照片</button><input type="file" id="up" accept="image/*" hidden></div>
<div class="row ex"><span class="lbl">卷积核：</span><span id="kers"></span></div>

<div class="imgs">
  <div><canvas id="cin" width="320" height="320"></canvas><div class="cap" id="capIn">原图</div></div>
  <div><canvas id="cout" width="320" height="320"></canvas><div class="cap" id="capOut">卷积结果</div></div>
</div>

<div class="row"><button class="main" id="scan">扫描</button><button id="full">直接出结果</button><span class="note" id="kdesc" style="margin:0"></span></div>

<div class="box">
  <h2>这一格是怎样算出来的</h2>
  <div class="calc">
    <div><div class="note" style="margin:0 0 2px">窗口里的像素</div><div class="m3" id="mp"></div></div>
    <div class="big">×</div>
    <div><div class="note" style="margin:0 0 2px">卷积核（可以改）</div><div class="k" id="kin"></div></div>
    <div class="formula" id="formula"></div>
  </div>
</div>

<details class="box rgb">
  <summary style="cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px">彩色像素：红、绿、蓝三个数</summary>
  <div class="row" style="align-items:flex-start">
    <div style="flex:1;min-width:220px">
      <div class="sl"><span style="color:#e53935">R 红</span><input type="range" id="r" min="0" max="255" value="255"><b id="rv"></b></div>
      <div class="sl"><span style="color:#43a047">G 绿</span><input type="range" id="g" min="0" max="255" value="165"><b id="gv"></b></div>
      <div class="sl"><span style="color:#1e88e5">B 蓝</span><input type="range" id="b" min="0" max="255" value="0"><b id="bv"></b></div>
      <div class="row ex"><button data-c="255,0,0">红</button><button data-c="255,255,0">黄</button><button data-c="255,255,255">白</button><button data-c="0,0,0">黑</button><button data-c="128,128,128">灰</button></div>
    </div>
    <div><div class="sw" id="sw"></div><div class="note" id="gray"></div></div>
  </div>
  <div class="note">彩色图片的每个像素由红、绿、蓝三个 0～255 的数组成。转成灰度时常用：灰度 ≈ 0.299 × R + 0.587 × G + 0.114 × B。</div>
</details>

<script src="../common/sim.js"></script>
<script>
(function () {
  var N = 32, img = [], out = [], sel = [12, 12], timer = null, shown = N * N;
  var KERS = [
    { n:"原样", k:[0,0,0, 0,1,0, 0,0,0], d:"中间是 1、其他是 0：结果和原图一样。" },
    { n:"模糊", k:[1/9,1/9,1/9, 1/9,1/9,1/9, 1/9,1/9,1/9], d:"九个格子各占 1/9：每个像素变成周围 9 个像素的平均值，图变模糊。" },
    { n:"锐化", k:[0,-1,0, -1,5,-1, 0,-1,0], d:"中间加强、四周减去：和周围差别大的地方差别更大，图更清晰。" },
    { n:"竖直边缘", k:[-1,0,1, -2,0,2, -1,0,1], d:"右边减左边：左右明暗变化大的地方（竖直的边）变亮，平坦的地方变黑。结果取绝对值。" },
    { n:"水平边缘", k:[-1,-2,-1, 0,0,0, 1,2,1], d:"下边减上边：上下明暗变化大的地方（水平的边）变亮。结果取绝对值。" },
    { n:"所有边缘", k:[-1,-1,-1, -1,8,-1, -1,-1,-1], d:"中间乘 8、减去周围 8 个：只要和周围不一样就变亮，各个方向的边都能找出来。" }
  ];
  var K = KERS[1].k.slice(), kname = "模糊", absMode = false;

  // 内置图片：在离屏画布上画好再取灰度
  function make(draw) {
    var c = document.createElement("canvas"); c.width = c.height = N;
    var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, N, N); draw(x);
    return gray(x.getImageData(0, 0, N, N).data);
  }
  function gray(d) { var a = []; for (var i = 0; i < d.length; i += 4) a.push(Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])); return a; }
  var IMGS = [
    { n:"方块和圆", f:function (x) { x.fillStyle = "#e0e0e0"; x.fillRect(0, 0, 32, 32); x.fillStyle = "#555"; x.fillRect(4, 5, 12, 12); x.fillStyle = "#222"; x.beginPath(); x.arc(22, 21, 7, 0, 7); x.fill(); x.fillStyle = "#999"; x.fillRect(3, 23, 9, 5); } },
    { n:"手写的 7", f:function (x) { x.fillStyle = "#f5f5f5"; x.fillRect(0, 0, 32, 32); x.strokeStyle = "#202020"; x.lineWidth = 3.2; x.lineCap = "round"; x.beginPath(); x.moveTo(8, 7); x.lineTo(24, 7); x.lineTo(14, 27); x.stroke(); x.beginPath(); x.moveTo(12, 17); x.lineTo(21, 17); x.stroke(); } },
    { n:"小房子", f:function (x) { x.fillStyle = "#cfe8ff"; x.fillRect(0, 0, 32, 22); x.fillStyle = "#8bc34a"; x.fillRect(0, 22, 32, 10); x.fillStyle = "#b71c1c"; x.beginPath(); x.moveTo(5, 14); x.lineTo(16, 5); x.lineTo(27, 14); x.fill(); x.fillStyle = "#fff3e0"; x.fillRect(8, 14, 16, 11); x.fillStyle = "#5d4037"; x.fillRect(14, 18, 4, 7); x.fillStyle = "#64b5f6"; x.fillRect(9, 16, 4, 4); x.fillRect(19, 16, 4, 4); } },
    { n:"渐变和条纹", f:function (x) { for (var i = 0; i < 32; i++) { x.fillStyle = "rgb(" + [i * 8, i * 8, i * 8] + ")"; x.fillRect(i, 0, 1, 16); } for (var j = 0; j < 32; j += 4) { x.fillStyle = "#111"; x.fillRect(j, 16, 2, 16); } } }
  ];
  img = make(IMGS[0].f);

  function at(a, r, c) { r = Math.max(0, Math.min(N - 1, r)); c = Math.max(0, Math.min(N - 1, c)); return a[r * N + c]; }
  function conv(r, c) { var s = 0; for (var i = -1; i <= 1; i++) for (var j = -1; j <= 1; j++) s += at(img, r + i, c + j) * K[(i + 1) * 3 + j + 1]; return s; }
  function shade(v) { return absMode ? Math.min(255, Math.abs(v)) : Math.max(0, Math.min(255, v)); }
  function compute() { var ks = K.reduce(function (a, b) { return a + b; }, 0); absMode = Math.abs(ks) < 1e-9 && K.some(function (v) { return v !== 0; }); out = []; for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) out.push(conv(r, c)); }

  var cin = document.getElementById("cin"), cout = document.getElementById("cout"), xi = cin.getContext("2d"), xo = cout.getContext("2d");
  function paint(ctx, a, limit, win) {
    var s = 320 / N; ctx.clearRect(0, 0, 320, 320);
    for (var i = 0; i < N * N; i++) {
      if (i >= limit) { ctx.fillStyle = "#fafafa"; } else { var v = Math.round(a === img ? a[i] : shade(a[i])); ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")"; }
      ctx.fillRect((i % N) * s, Math.floor(i / N) * s, Math.ceil(s), Math.ceil(s));
    }
    if (win) {
      ctx.lineWidth = 2; ctx.strokeStyle = "#ef6c00";
      if (win === 3) ctx.strokeRect((sel[1] - 1) * s, (sel[0] - 1) * s, 3 * s, 3 * s);
      else ctx.strokeRect(sel[1] * s, sel[0] * s, s, s);
    }
  }
  function f(v) { return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : (Math.abs(v - 1 / 9) < 1e-9 ? "1/9" : v.toFixed(2)); }
  function detail() {
    var r = sel[0], c = sel[1], h = "", terms = [];
    for (var i = -1; i <= 1; i++) for (var j = -1; j <= 1; j++) {
      var p = at(img, r + i, c + j), k = K[(i + 1) * 3 + j + 1];
      h += '<span style="background:rgb(' + [p, p, p] + ');color:' + (p < 128 ? "#fff" : "#263238") + '">' + p + "</span>";
      if (k !== 0) terms.push(p + " × " + (k < 0 ? "(" + f(k) + ")" : f(k)));
    }
    document.getElementById("mp").innerHTML = h;
    var v = conv(r, c), sh = Math.round(shade(v));
    document.getElementById("formula").innerHTML = "位置：第 " + (r + 1) + " 行、第 " + (c + 1) + " 列<br>对应格子相乘再相加（只列出卷积核不为 0 的格子）：<br><span class='mono'>" + (terms.join(" + ") || "0") + "</span><br>= <b>" + (Math.abs(v - Math.round(v)) < 0.005 ? Math.round(v) : v.toFixed(1)) + "</b>" +
      (absMode ? "，取绝对值" : "") + (sh !== Math.round(v) || absMode ? "，限制在 0～255 之间 → 显示为 <b>" + sh + "</b>" : "") +
      "<br><span class='note'>窗口碰到图片边缘时，超出的部分用最近的边缘像素代替。</span>";
  }
  function render() { paint(xi, img, N * N, 3); paint(xo, out, shown, 1); detail(); }

  function kerUI() {
    var h = ""; for (var i = 0; i < 9; i++) h += '<input data-i="' + i + '" value="' + f(K[i]) + '" inputmode="decimal">';
    document.getElementById("kin").innerHTML = h;
    document.querySelectorAll("#kin input").forEach(function (el) {
      el.addEventListener("change", function () {
        var t = el.value.trim(), v = t.indexOf("/") > 0 ? Number(t.split("/")[0]) / Number(t.split("/")[1]) : Number(t);
        if (isNaN(v)) { el.value = f(K[+el.dataset.i]); return; }
        K[+el.dataset.i] = v; kname = "自定义"; mark(); document.getElementById("kdesc").textContent = "自己设计的卷积核。九个数加起来等于 0 时，结果取绝对值显示（适合找边缘）。"; stop(); compute(); shown = N * N; render();
      });
    });
  }
  function mark() { document.querySelectorAll("#kers button").forEach(function (b) { b.classList.toggle("on", b.textContent === kname); }); document.getElementById("capOut").textContent = "卷积结果（" + kname + "）"; }
  document.getElementById("kers").innerHTML = KERS.map(function (k, i) { return '<button data-k="' + i + '">' + k.n + "</button>"; }).join("");
  document.querySelectorAll("#kers button").forEach(function (b) {
    b.onclick = function () { var k = KERS[+b.dataset.k]; K = k.k.slice(); kname = k.n; document.getElementById("kdesc").textContent = k.d; stop(); compute(); shown = N * N; mark(); kerUI(); render(); };
  });
  document.getElementById("imgs").innerHTML = IMGS.map(function (m, i) { return '<button data-m="' + i + '">' + m.n + "</button>"; }).join("");
  function markImg(i) { document.querySelectorAll("#imgs button").forEach(function (b) { b.classList.toggle("on", +b.dataset.m === i); }); }
  document.querySelectorAll("#imgs button").forEach(function (b) {
    b.onclick = function () { stop(); N = 32; img = make(IMGS[+b.dataset.m].f); sel = [12, 12]; markImg(+b.dataset.m); compute(); shown = N * N; document.getElementById("capIn").textContent = "原图（32 × 32 像素）"; render(); };
  });
  document.getElementById("upBtn").onclick = function () { document.getElementById("up").click(); };
  document.getElementById("up").onchange = function (e) {
    var file = e.target.files[0]; if (!file) return;
    var im = new Image(); im.onload = function () {
      stop(); N = 64; var c = document.createElement("canvas"); c.width = c.height = N; var x = c.getContext("2d");
      var s = Math.min(im.width, im.height); x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, N, N);
      img = gray(x.getImageData(0, 0, N, N).data); sel = [32, 32]; markImg(-1); compute(); shown = N * N;
      document.getElementById("capIn").textContent = "你的照片（缩成 64 × 64 灰度图，只在本机处理，不会上传）"; render(); URL.revokeObjectURL(im.src);
    };
    im.src = URL.createObjectURL(file);
  };

  function pick(e) {
    var r = cin.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    var c = Math.floor((p.clientX - r.left) / r.width * N), rr = Math.floor((p.clientY - r.top) / r.height * N);
    if (c < 0 || rr < 0 || c >= N || rr >= N) return; sel = [rr, c]; stop(); shown = N * N; render();
  }
  var down = false;
  cin.addEventListener("pointerdown", function (e) { down = true; pick(e); });
  cin.addEventListener("pointermove", function (e) { if (down) pick(e); });
  window.addEventListener("pointerup", function () { down = false; });
  cout.addEventListener("pointerdown", function (e) { var r = cout.getBoundingClientRect(); sel = [Math.floor((e.clientY - r.top) / r.height * N), Math.floor((e.clientX - r.left) / r.width * N)]; stop(); shown = N * N; render(); });

  function stop() { if (timer) { clearInterval(timer); timer = null; document.getElementById("scan").textContent = "扫描"; } }
  document.getElementById("scan").onclick = function () {
    if (timer) { stop(); return; }
    if (shown >= N * N) shown = 0;
    this.textContent = "暂停";
    var step = N === 32 ? 2 : 8;
    timer = setInterval(function () {
      shown = Math.min(N * N, shown + step); var i = shown - 1; sel = [Math.floor(i / N), i % N]; render();
      if (shown >= N * N) stop();
    }, 30);
  };
  document.getElementById("full").onclick = function () { stop(); shown = N * N; render(); };

  // 彩色像素
  function rgb() {
    var R = +document.getElementById("r").value, G = +document.getElementById("g").value, B = +document.getElementById("b").value;
    document.getElementById("rv").textContent = R; document.getElementById("gv").textContent = G; document.getElementById("bv").textContent = B;
    document.getElementById("sw").style.background = "rgb(" + R + "," + G + "," + B + ")";
    document.getElementById("gray").textContent = "(" + R + ", " + G + ", " + B + ")，灰度 ≈ " + Math.round(0.299 * R + 0.587 * G + 0.114 * B);
  }
  ["r", "g", "b"].forEach(function (id) { document.getElementById(id).oninput = rgb; });
  document.querySelectorAll("[data-c]").forEach(function (b) { b.onclick = function () { var c = b.dataset.c.split(","); document.getElementById("r").value = c[0]; document.getElementById("g").value = c[1]; document.getElementById("b").value = c[2]; rgb(); }; });
  rgb();

  markImg(0); mark(); kerUI(); document.getElementById("kdesc").textContent = KERS[1].d; document.getElementById("capIn").textContent = "原图（32 × 32 像素）"; compute(); render();
})();
</script>
</body>
</html>
